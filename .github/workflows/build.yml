name: Nerdminer
on:
  workflow_dispatch:
  push:
    branches:
      - prerelease

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build PlatformIO Project
        run: pio run
      - name: Debug - Check generated files
        run: |
          echo "=== All .bin files found ==="
          find . -name "*.bin" -type f
          echo "=== Directory structure ==="
          ls -R
      - name: Archive firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware-files-${{ github.sha }}
          path: |
            firmware/**/*.bin
          if-no-files-found: error
      - name: Get version
        id: version_step
        run: echo "version=`cat src/version.h | grep CURRENT_VERSION | awk -F\\" '{print $2}'`" >> $GITHUB_OUTPUT

  prerelease:
    needs: build
    permissions:
      contents: write
      discussions: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prerelease' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download firmware files
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/firmware-download/
          name: firmware-files-${{ github.sha }}
      - name: Debug - Check downloaded files
        run: |
          echo "=== Working directory ==="
          pwd
          ls -la
          echo "=== All .bin files after download ==="
          find . -name "*.bin" -type f
      - name: Prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: nerdminer-prerelease-${{ needs.build.outputs.version }}
          tag_name: nerdminer-prerelease-${{ needs.build.outputs.version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            firmware-download/**/*.bin
