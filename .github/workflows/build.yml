name: NerdMiner CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prerelease

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build All Environments
        run: pio run

      - name: Get Version
        id: version_step
        run: |
          VERSION=$(grep "CURRENT_VERSION" src/version.h | awk -F\" '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Archive Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: firmware/
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prerelease' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Download Firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: firmware-dist

      - name: Determine Release Metadata
        id: meta
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "title=NerdMiner $VERSION" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tag=$VERSION-pre-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=NerdMiner $VERSION (Pre-release)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.title }}
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: firmware-dist/**/*.bin
          generate_release_notes: true
          make_latest: ${{ github.ref == 'refs/heads/main' }}
